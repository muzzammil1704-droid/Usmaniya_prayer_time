<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ஐந்து வக்து தொழுகை கடிகாரம் | 5-Point Star Prayer Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0c0c0e;
      --metal: #c5c8ce;
      --gold: #d4a84b;
      --gold-bright: #f0d080;
      --gold-glow: rgba(212, 168, 75, 0.55);
      --text: #f2efe9;
      --muted: #9a958c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Cairo', 'Noto Sans Tamil', sans-serif;
      background: radial-gradient(ellipse at 50% 30%, #1a1a1f 0%, #0c0c0e 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px 30px;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }
    .header h1 {
      font-family: 'Amiri', serif;
      font-size: 1.4rem;
      color: var(--gold-bright);
    }
    .header .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 380px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls input, .controls select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid #2a2a30;
      background: #1a1a20;
      color: var(--text);
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    .controls input { flex: 1; min-width: 110px; }
    .controls button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 9px 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(145deg, #d4a84b, #b08930);
      color: #1a1208;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(212,168,75,0.3);
    }
    #iqamahBtn {
      background: linear-gradient(145deg, #2a4a3a, #1a3328);
      color: #d4a84b;
      border: 1px solid #3a5a4a;
      box-shadow: none;
    }
    #iqamahBtn.active {
      background: linear-gradient(145deg, #d4a84b, #b08930);
      color: #1a1208;
    }

    .clock-card {
      background: linear-gradient(165deg, #1c1c22 0%, #121216 100%);
      border-radius: 32px;
      padding: 26px 20px 18px;
      box-shadow:
        12px 12px 28px rgba(0,0,0,0.55),
        -6px -6px 18px rgba(40,40,48,0.25),
        inset 0 1px 0 rgba(255,255,255,0.04);
      border: 1px solid #2a2a32;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .clock-wrapper {
      position: relative;
      width: min(86vw, 360px);
      height: min(86vw, 360px);
      filter: drop-shadow(0 22px 36px rgba(0,0,0,0.5));
    }

    .outer-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8eaee 0%, #a0a4ac 40%, #6d7179 70%, #b8bcc4 100%);
      box-shadow:
        0 0 0 1px #4a4e56,
        inset 0 3px 8px rgba(255,255,255,0.35),
        inset 0 -4px 10px rgba(0,0,0,0.35);
      z-index: 1;
    }

    .clock-face {
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: linear-gradient(160deg, #1e1e24 0%, #121216 100%);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 0 0 3px #2a2a30;
      overflow: visible;
      z-index: 2;
    }

    /* Small 5-pointed star (centered only) */
    .star-svg {
      position: absolute;
      inset: 14%;
      width: 72%;
      height: 72%;
      z-index: 3;
      pointer-events: none;
    }
    .star-svg path {
      fill: none;
      stroke: #d4a84b;
      stroke-width: 2;
      opacity: 0.8;
      filter: drop-shadow(0 0 5px rgba(212,168,75,0.45));
    }
    .star-svg .inner-star {
      stroke-width: 1.3;
      opacity: 0.5;
    }
    .star-svg circle {
      fill: none;
      stroke: #d4a84b;
      stroke-width: 1.3;
      opacity: 0.55;
    }

    .center-disc {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 64px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f5e6b8 0%, #d4a84b 45%, #8a6a28 100%);
      box-shadow:
        0 0 18px var(--gold-glow),
        0 0 35px rgba(212,168,75,0.2),
        inset 0 3px 6px rgba(255,255,255,0.4),
        inset 0 -3px 8px rgba(0,0,0,0.35);
      z-index: 8;
    }

    .hand {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: 50% 100%;
      background: linear-gradient(to top, #c9a227, #f0d080);
      border-radius: 4px;
      z-index: 9;
      box-shadow: 0 0 6px rgba(212,168,75,0.5);
    }
    .hand.hour {
      width: 3.5px;
      height: 24px;
      margin-left: -1.75px;
      margin-top: -24px;
    }
    .hand.minute {
      width: 2.5px;
      height: 32px;
      margin-left: -1.25px;
      margin-top: -32px;
    }
    .hand-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 11px;
      height: 11px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #f5e6b8;
      box-shadow: 0 0 8px var(--gold-glow);
      z-index: 10;
    }

    /* Prayer slots – positioned exactly on star tips */
    .prayer-slot {
      position: absolute;
      width: 92px;
      text-align: center;
      z-index: 8;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .prayer-slot .ar {
      font-family: 'Amiri', serif;
      font-size: 0.95rem;
      color: var(--gold-bright);
      line-height: 1.1;
      text-shadow: 0 0 8px rgba(212,168,75,0.4);
    }
    .prayer-slot .en {
      font-size: 0.58rem;
      letter-spacing: 1.2px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 1px;
      text-transform: uppercase;
    }
    .prayer-slot .time {
      font-size: 0.74rem;
      font-weight: 700;
      color: #e8e4dc;
      margin-top: 2px;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .prayer-slot .iqamah {
      font-size: 0.62rem;
      color: #a8b5a0;
      margin-top: 1px;
      white-space: nowrap;
      opacity: 0.9;
    }
    .prayer-slot .iqamah:empty {
      display: none;
    }

    .prayer-slot.active {
      transform: translate(-50%, -50%) scale(1.12) !important;
      filter: drop-shadow(0 0 10px rgba(240,208,128,0.5));
    }
    .prayer-slot.active .ar,
    .prayer-slot.active .en,
    .prayer-slot.active .time,
    .prayer-slot.active .iqamah {
      color: #fff8e0;
      text-shadow: 0 0 14px rgba(240, 208, 128, 0.9);
    }

    .center-info {
      text-align: center;
      margin-top: 12px;
      line-height: 1.25;
    }
    .center-info .next-label {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .center-info .next-name {
      font-family: 'Amiri', serif;
      font-size: 1.05rem;
      color: var(--gold-bright);
      margin: 2px 0;
    }
    .center-info .countdown {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e8e4dc;
      letter-spacing: 1px;
    }

    .stand {
      width: 100px;
      height: 26px;
      margin-top: -4px;
      background: linear-gradient(to bottom, #5c4033, #3d2b1f);
      border-radius: 0 0 40% 40%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      position: relative;
      z-index: 0;
    }
    .stand::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 12px;
      background: linear-gradient(to bottom, #6b4c38, #4a3225);
      border-radius: 5px 5px 0 0;
    }

    .meta {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .meta .hijri {
      font-family: 'Amiri', serif;
      color: var(--gold);
      font-size: 1rem;
      margin-top: 2px;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(12,12,14,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      font-size: 0.95rem;
      color: var(--gold);
    }

    .error {
      color: #e07a6a;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
      min-height: 1.2em;
    }

    .footer {
      margin-top: 16px;
      font-size: 0.7rem;
      color: #555;
    }

    @media (max-width: 380px) {
      .prayer-slot { width: 72px; }
      .prayer-slot .ar { font-size: 0.88rem; }
      .prayer-slot .time { font-size: 0.8rem; }
      .center-disc { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ஐந்து வக்து தொழுகை</h1>
    <div class="sub">5-Point Star • Exact Tip Alignment</div>
  </div>

  <div class="controls">
    <select id="modeSelect" onchange="onModeChange()">
      <option value="mosque" selected>மஸ்ஜித் நேரம் (Board)</option>
      <option value="api">API (City)</option>
    </select>
    <input type="text" id="cityInput" placeholder="City" value="Chennai" style="display:none;" />
    <select id="countrySelect" style="display:none;">
      <option value="India" selected>India</option>
      <option value="Saudi Arabia">Saudi Arabia</option>
      <option value="United Arab Emirates">UAE</option>
      <option value="Pakistan">Pakistan</option>
      <option value="Bangladesh">Bangladesh</option>
      <option value="Malaysia">Malaysia</option>
      <option value="United Kingdom">UK</option>
      <option value="United States">USA</option>
      <option value="Singapore">Singapore</option>
      <option value="Sri Lanka">Sri Lanka</option>
    </select>
    <button id="loadBtn" onclick="loadPrayerTimes()" style="display:none;">Load</button>
    <button id="iqamahBtn" onclick="toggleIqamah()" style="display:none;">இகாமத் காட்டு</button>
  </div>

  <div class="clock-card">
    <div class="clock-wrapper">
      <div class="outer-ring"></div>

      <div class="clock-face" id="clockFace">
        <!-- Perfect 5-pointed star -->
        <svg class="star-svg" viewBox="0 0 200 200">
          <path d="M100 18 L118.5 72.5 L176 72.5 L129.5 106.5 L147.5 161 L100 127 L52.5 161 L70.5 106.5 L24 72.5 L81.5 72.5 Z" />
          <path class="inner-star" d="M100 42 L112 75 L148 75 L119 96 L131 130 L100 109 L69 130 L81 96 L52 75 L88 75 Z" />
          <circle cx="100" cy="100" r="32" />
          <circle cx="100" cy="100" r="22" />
        </svg>

        <div class="loading-overlay" id="loading">Loading…</div>

        <!-- 5 Prayer slots – positioned on the 5 star tips -->
        <div class="prayer-slot" id="item-fajr" data-angle="-90">
          <div class="ar">فجر</div>
          <div class="en">FAJR</div>
          <div class="time" id="time-fajr">--:--</div>
          <div class="iqamah" id="iqamah-fajr"></div>
        </div>

        <div class="prayer-slot" id="item-dhuhr" data-angle="-18">
          <div class="ar">ظهر</div>
          <div class="en">DHUHR</div>
          <div class="time" id="time-dhuhr">--:--</div>
          <div class="iqamah" id="iqamah-dhuhr"></div>
        </div>

        <div class="prayer-slot" id="item-asr" data-angle="54">
          <div class="ar">عصر</div>
          <div class="en">ASR</div>
          <div class="time" id="time-asr">--:--</div>
          <div class="iqamah" id="iqamah-asr"></div>
        </div>

        <div class="prayer-slot" id="item-maghrib" data-angle="126">
          <div class="ar">مغرب</div>
          <div class="en">MAGHRIB</div>
          <div class="time" id="time-maghrib">--:--</div>
          <div class="iqamah" id="iqamah-maghrib"></div>
        </div>

        <div class="prayer-slot" id="item-isha" data-angle="198">
          <div class="ar">عشاء</div>
          <div class="en">ISHA</div>
          <div class="time" id="time-isha">--:--</div>
          <div class="iqamah" id="iqamah-isha"></div>
        </div>

        <div class="center-disc"></div>
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minuteHand"></div>
        <div class="hand-center"></div>
      </div>
    </div>

    <div class="stand"></div>

    <div class="center-info">
      <div class="next-label">Next Prayer</div>
      <div class="next-name" id="nextPrayerName">—</div>
      <div class="countdown" id="countdown">—</div>
    </div>
  </div>

  <div class="meta">
    <div id="gregorianDate">—</div>
    <div class="hijri" id="hijriDate">—</div>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="footer">5 Tips = 5 Prayers • Exact Star Alignment</div>

  <script>
    const prayerOrder = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    const prayerNamesTa = {
      Fajr: 'ஃபஜ்ர்', Dhuhr: 'ளுஹ்ர்', Asr: 'அஸர்',
      Maghrib: 'மஃக்ரிப்', Isha: 'இஷா'
    };
    const prayerNamesAr = {
      Fajr: 'فجر', Dhuhr: 'ظهر', Asr: 'عصر',
      Maghrib: 'مغرب', Isha: 'عشاء'
    };

    let prayerTimes = {};

    // Position the 5 prayer slots EXACTLY on the tips of the 5-pointed star
    function positionPrayerSlots() {
      const face = document.getElementById('clockFace');
      if (!face) return;
      const size = face.offsetWidth;
      const center = size / 2;
      // Labels a bit farther out for better visual spacing
      const radius = size * 0.38;

      document.querySelectorAll('.prayer-slot').forEach(slot => {
        const angleDeg = parseFloat(slot.dataset.angle);
        const angleRad = (angleDeg * Math.PI) / 180;

        const x = center + radius * Math.cos(angleRad);
        const y = center + radius * Math.sin(angleRad);

        slot.style.left = x + 'px';
        slot.style.top = y + 'px';
        // Base transform (active state overrides with scale)
        if (!slot.classList.contains('active')) {
          slot.style.transform = 'translate(-50%, -50%)';
        }
      });
    }

    function updateHands() {
      const now = new Date();
      const h = now.getHours() % 12;
      const m = now.getMinutes();
      const s = now.getSeconds();

      const hourDeg = (h * 30) + (m * 0.5);
      const minDeg = (m * 6) + (s * 0.1);

      document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
      document.getElementById('minuteHand').style.transform = `rotate(${minDeg}deg)`;
    }

    function parseTime(timeStr) {
      const clean = timeStr.split(' ')[0];
      const [h, m] = clean.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }

    // Convert 24h "HH:MM" → 12h "h:MM AM/PM"
    function formatTo12Hour(timeStr) {
      const clean = timeStr.split(' ')[0];
      let [h, m] = clean.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }

    function calculateNextPrayer(now) {
      let found = null;
      let minDiff = Infinity;

      for (const name of prayerOrder) {
        const t = parseTime(prayerTimes[name]);
        let diff = t - now;
        if (diff < 0) diff += 24 * 60 * 60 * 1000;
        if (diff < minDiff) {
          minDiff = diff;
          found = name;
        }
      }

      prayerOrder.forEach(p => {
        const el = document.getElementById('item-' + p.toLowerCase());
        if (el) {
          const isActive = p === found;
          el.classList.toggle('active', isActive);
          // Re-apply transform correctly
          if (isActive) {
            el.style.transform = 'translate(-50%, -50%) scale(1.12)';
          } else {
            el.style.transform = 'translate(-50%, -50%)';
          }
        }
      });

      document.getElementById('nextPrayerName').textContent =
        prayerNamesAr[found] + '  •  ' + prayerNamesTa[found];

      const totalSec = Math.floor(minDiff / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      document.getElementById('countdown').textContent =
        `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }

    // மஸ்ஜித் போர்டு நேரங்கள் (பாங்கு / Azan)
    const mosqueTimes = {
      Fajr: '04:55',
      Dhuhr: '12:20',
      Asr: '15:30',
      Maghrib: '18:20',
      Isha: '19:30'
    };
    // இகாமத் (optional display)
    const mosqueIqamah = {
      Fajr: '05:25',
      Dhuhr: '13:00',
      Asr: '15:45',
      Maghrib: '18:25',
      Isha: '20:30'
    };

    let showIqamah = false;

    function updateDisplayedTimes() {
      const names = ['fajr','dhuhr','asr','maghrib','isha'];
      const keys = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
      const source = showIqamah ? mosqueIqamah : mosqueTimes;

      names.forEach((n, i) => {
        const timeEl = document.getElementById('time-' + n);
        const iqaEl = document.getElementById('iqamah-' + n);
        if (timeEl) timeEl.textContent = formatTo12Hour(source[keys[i]]);
        if (iqaEl) iqaEl.textContent = '';
      });

      // Countdown always based on Azan (பாங்கு)
      prayerTimes = {
        Fajr: mosqueTimes.Fajr,
        Dhuhr: mosqueTimes.Dhuhr,
        Asr: mosqueTimes.Asr,
        Maghrib: mosqueTimes.Maghrib,
        Isha: mosqueTimes.Isha
      };
      calculateNextPrayer(new Date());

      const btn = document.getElementById('iqamahBtn');
      if (btn) {
        btn.textContent = showIqamah ? 'பாங்கு காட்டு' : 'இகாமத் காட்டு';
        btn.classList.toggle('active', showIqamah);
      }
      const hijriEl = document.getElementById('hijriDate');
      if (hijriEl) {
        hijriEl.textContent = showIqamah ? 'இகாமத் (Iqamah)' : 'பாங்கு (Azan)';
      }
    }

    function toggleIqamah() {
      showIqamah = !showIqamah;
      updateDisplayedTimes();
    }

    function applyTimes(timings) {
      prayerTimes = {
        Fajr: timings.Fajr,
        Dhuhr: timings.Dhuhr,
        Asr: timings.Asr,
        Maghrib: timings.Maghrib,
        Isha: timings.Isha
      };
      document.getElementById('time-fajr').textContent = formatTo12Hour(timings.Fajr);
      document.getElementById('time-dhuhr').textContent = formatTo12Hour(timings.Dhuhr);
      document.getElementById('time-asr').textContent = formatTo12Hour(timings.Asr);
      document.getElementById('time-maghrib').textContent = formatTo12Hour(timings.Maghrib);
      document.getElementById('time-isha').textContent = formatTo12Hour(timings.Isha);
      ['fajr','dhuhr','asr','maghrib','isha'].forEach(n => {
        const el = document.getElementById('iqamah-' + n);
        if (el) el.textContent = '';
      });
      calculateNextPrayer(new Date());
    }

    function loadMosqueTimes() {
      const loading = document.getElementById('loading');
      const errorMsg = document.getElementById('errorMsg');
      loading.style.display = 'flex';
      errorMsg.textContent = '';

      updateDisplayedTimes();

      document.getElementById('gregorianDate').textContent = 'மஸ்ஜித் போர்டு நேரம்';
      document.getElementById('iqamahBtn').style.display = '';

      loading.style.display = 'none';
    }

    async function loadPrayerTimes() {
      const mode = document.getElementById('modeSelect').value;
      if (mode === 'mosque') {
        loadMosqueTimes();
        return;
      }

      const city = document.getElementById('cityInput').value.trim() || 'Chennai';
      const country = document.getElementById('countrySelect').value;
      const loading = document.getElementById('loading');
      const errorMsg = document.getElementById('errorMsg');

      loading.style.display = 'flex';
      errorMsg.textContent = '';

      try {
        const url = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.code !== 200) throw new Error('City not found');

        const timings = data.data.timings;
        applyTimes(timings);

        const g = data.data.date.gregorian;
        document.getElementById('gregorianDate').textContent =
          `${g.weekday.en}, ${g.day} ${g.month.en} ${g.year}`;

        const h = data.data.date.hijri;
        document.getElementById('hijriDate').textContent =
          `${h.day} ${h.month.en} ${h.year} AH`;
      } catch (err) {
        errorMsg.textContent = 'Error: ' + err.message;
        console.error(err);
      } finally {
        loading.style.display = 'none';
      }
    }

    function onModeChange() {
      const mode = document.getElementById('modeSelect').value;
      const showApi = mode === 'api';
      document.getElementById('cityInput').style.display = showApi ? '' : 'none';
      document.getElementById('countrySelect').style.display = showApi ? '' : 'none';
      document.getElementById('loadBtn').style.display = showApi ? '' : 'none';
      if (showApi) {
        showIqamah = false;
        document.getElementById('iqamahBtn').style.display = 'none';
      }
      loadPrayerTimes();
    }

    window.addEventListener('load', () => {
      positionPrayerSlots();
      window.addEventListener('resize', positionPrayerSlots);
    });
    setTimeout(positionPrayerSlots, 200);
    setTimeout(positionPrayerSlots, 600);

    setInterval(() => {
      updateHands();
      if (Object.keys(prayerTimes).length) {
        calculateNextPrayer(new Date());
      }
    }, 1000);

    updateHands();
    loadMosqueTimes();

    document.getElementById('cityInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') loadPrayerTimes();
    });
  </script>
</body>
</html>
